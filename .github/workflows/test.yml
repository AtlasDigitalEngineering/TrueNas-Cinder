name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the deployment target: Kolla 2025.1 builds on Ubuntu
        # Noble 24.04, which ships python3 3.12. 3.10 is kept as breadth
        # for anyone running the client against an older Kolla, where
        # Jammy 22.04 and 3.10 genuinely were the base.
        python-version: ['3.12', '3.10']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      # `python -m pytest` (not bare `pytest`) so the repo root lands on
      # sys.path and `truenas_cinder_driver` is importable. The package is not
      # installable yet — issue #23 replaces this with a real install.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit \
            --cov=truenas_cinder_driver \
            --cov-report=xml \
            --cov-report=term-missing

      # Scoped to tests/unit: tests/driver imports Cinder, which this
      # job deliberately does not install. Exercises tests/__init__.py,
      # which pytest does not need, so the discover path cannot rot
      # unnoticed. One leg is enough to prove discovery works.
      - name: Run unit tests via unittest discover
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s tests/unit -t .

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  driver:
    name: Driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than a matrix: this job tests against the real
      # Cinder base classes, and the deployment runs one interpreter --
      # 3.12, from Kolla 2025.1's Ubuntu Noble 24.04 base.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Cinder pulls ~58 direct dependencies, which is why this is its own
      # job -- the api_client suite stays dependency-free and fast.
      # Stubbing Cinder was considered and rejected: it would test the
      # driver against a fake base class, and would not have caught that
      # SanDriver.check_for_setup_error() demands SSH credentials this
      # driver never uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[driver]'

      - name: Run driver tests
        run: python -m pytest tests/driver

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 truenas_cinder_driver tests tools

  # Nothing linted the shell embedded in workflow YAML, and that file has
  # produced nine defects -- three of them only in production (#73, #74,
  # #75). Every one was caught by a human reading it or hand-executing
  # the extracted script (#82).
  workflows:
    name: Lint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than :latest. The image bundles shellcheck, which
      # is where most of the value is -- actionlint alone checks workflow
      # syntax, shellcheck checks the bash inside every `run:` body.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # actionlint flags an interpolated expression only when it knows
      # the value is untrusted -- `github.event.*` and friends. It says
      # nothing about `steps.<id>.outputs.*`, which is what this repo
      # uses and which is safe only because of where the value came
      # from. This enforces the stricter rule (#81).
      - name: No workflow expressions in shell bodies
        run: python3 tools/check_workflows.py
