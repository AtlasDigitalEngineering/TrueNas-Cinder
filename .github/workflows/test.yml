name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the deployment target (Kolla 2025.1 / Ubuntu Jammy).
        # 3.12 guards against forward-compatibility regressions.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      # `python -m pytest` (not bare `pytest`) so the repo root lands on
      # sys.path and `truenas_cinder_driver` is importable. The package is not
      # installable yet — issue #23 replaces this with a real install.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit \
            --cov=truenas_cinder_driver \
            --cov-report=xml \
            --cov-report=term-missing

      # Scoped to tests/unit: tests/driver imports Cinder, which this
      # job deliberately does not install. Exercises tests/__init__.py,
      # which pytest does not need, so the discover path cannot rot
      # unnoticed. One leg is enough to prove discovery works.
      - name: Run unit tests via unittest discover
        if: matrix.python-version == '3.10'
        run: python -m unittest discover -s tests/unit -t .

      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  driver:
    name: Driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the Kolla-Ansible 2025.1 / Ubuntu Jammy target rather than
      # a matrix: this job exists to test against the real Cinder base
      # classes, and the deployment only ever runs one interpreter.
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: driver-test-requirements.txt

      # Cinder pulls ~58 direct dependencies, which is why this is its own
      # job -- the api_client suite stays dependency-free and fast.
      # Stubbing Cinder was considered and rejected: it would test the
      # driver against a fake base class, and would not have caught that
      # SanDriver.check_for_setup_error() demands SSH credentials this
      # driver never uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r driver-test-requirements.txt

      - name: Run driver tests
        run: python -m pytest tests/driver

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 truenas_cinder_driver tests tools
