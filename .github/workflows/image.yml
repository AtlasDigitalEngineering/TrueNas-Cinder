name: Image

# Publishes the cinder-volume image carrying the driver.
#
# Tags only, never on push to main: a container running in a cluster should
# be traceable to a release, not to whatever main happened to be that day.
# workflow_dispatch is there for rebuilding a tag against a newer base image
# without cutting a new driver release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. v1.0.0'
        required: true

env:
  # Any OCI registry works. ghcr.io needs no secret beyond the workflow's own
  # GITHUB_TOKEN and lives in the same namespace as the repository.
  REGISTRY: ghcr.io
  IMAGE_NAME: cinder-volume-truenas
  # Kolla 2025.1 builds its Ubuntu images on Noble; there is no jammy tag for
  # this release. Overridable to build against a different OpenStack release.
  KOLLA_BASE: quay.io/openstack.kolla/cinder-volume:2025.1-ubuntu-noble

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the final step uploads the wheel as a release asset
      # via GITHUB_TOKEN, which needs contents:write. With read it 403s -- and
      # only ever on a real tag, since this workflow does not run otherwise.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build packaging
          python -m build --wheel

      # The image tag is the driver version, taken from the package rather
      # than from the git tag, so the container and `pip show` cannot
      # disagree about what is installed.
      - name: Determine the version and image reference
        id: version
        run: |
          python -m pip install -e .
          version=$(python -c 'import truenas_cinder_driver as p; print(p.__version__)')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 decides what counts as a pre-release, via the same
          # library pip and setuptools use. A regex here would be a second
          # definition of "pre-release" free to drift from the one the test
          # suite enforces, and would have to be right about post-releases
          # and dev builds to boot.
          prerelease=$(python -c "from packaging.version import Version; \
              print(str(Version('${version}').is_prerelease).lower())")
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          # OCI repository names must be lowercase, and the owner login keeps
          # its original case (AtlasDigitalEngineering). Passing it through
          # verbatim fails the push with "invalid reference format" before the
          # registry is ever contacted.
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "building ${image}:${version} (prerelease=${prerelease})"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/cinder-volume/Dockerfile
          build-args: KOLLA_BASE=${{ env.KOLLA_BASE }}
          push: true
          tags: >-
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.base.name=${{ env.KOLLA_BASE }}

      # A green publish does not mean a usable image. A package first pushed
      # with GITHUB_TOKEN is private even when the repository is public, and
      # nothing above notices: the build succeeds, the release looks right,
      # and the failure surfaces on the deploy host as an auth error. This
      # says so here instead.
      #
      # Warns rather than fails. The image genuinely was published, and
      # visibility is a one-time manual step -- GITHUB_TOKEN does not carry
      # the scope and the REST API does not expose container visibility at
      # all -- so failing the release would make the first publish of every
      # new package permanently red.
      - name: Check the image can be pulled anonymously
        run: |
          image='${{ steps.version.outputs.image }}'
          tag='${{ steps.version.outputs.version }}'
          repo="${image#*/}"
          docs='docs/deployment.md, "The first publish creates a private package"'

          token=$(curl -sf \
            "https://ghcr.io/token?scope=repository:${repo}:pull" \
            | jq -r '.token // empty') || true

          # One line per annotation: a workflow command stops at the
          # first newline, so a wrapped message loses everything after it.
          if [ -z "${token}" ]; then
            echo "::warning::${image}:${tag} was published but is NOT anonymously pullable - the package is private, so deployments will fail to pull it. Change the package visibility to public, or configure registry credentials on every node. See ${docs}."
            exit 0
          fi

          # The Accept header is required: without it the registry answers
          # 404 for an image that is public and present.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")

          if [ "${code}" = "200" ]; then
            echo "${image}:${tag} is anonymously pullable."
          else
            echo "::warning::${image}:${tag} answered HTTP ${code} to an anonymous manifest request, so nodes may not be able to pull it. See ${docs}."
          fi

      - name: Attach the wheel to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          # Otherwise a release candidate is published as "Latest" and is
          # the first thing a visitor sees -- which is what happened to
          # v1.0.0rc1. Derived from the version so it cannot be forgotten.
          prerelease: ${{ steps.version.outputs.prerelease }}
          # GitHub writes the changelog from the commits since the previous
          # tag. `body` is prepended to it rather than replacing it, so the
          # image reference leads and the generated notes follow.
          generate_release_notes: true
          body: |
            ### Container image

            ```
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

            In `globals.yml`:

            ```yaml
            cinder_volume_image_full: "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
            ```

            Built on `${{ env.KOLLA_BASE }}`. The package must be public
            before nodes can pull it — see
            [docs/deployment.md](docs/deployment.md).
