name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR #: ${{ github.event.pull_request.number }}

            Review this PR against the conventions in AGENTS.md (repo root).
            Focus on: correctness/bugs, security issues, consistency with the
            existing codebase, and test coverage for the change. This is a
            review only — do not push commits or approve/merge the PR;
            setkeh is the required human approver.

            Post a summary via `gh pr comment` and inline comments for
            specific issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
