name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs do not receive secrets, so the action would no-op and still
    # report success. Skip them outright rather than posting a green check
    # that implies a review happened. Do NOT switch to pull_request_target to
    # work around this — it runs untrusted code with write permissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The action can run a full review, exit 0, and publish nothing (#38).
      # Observed: eleven runs in one session, ten posted, one silent after
      # 3m03s -- inside the duration range of the runs that did post, so it
      # was not exiting early. Nothing distinguishes that from a clean review
      # at any surface: the check is green, mergeStateStatus is CLEAN, and
      # there are no unresolved threads. A PR with no review at all looks
      # exactly like a PR that passed one.
      #
      # So count what the reviewer has published before and after. Anything
      # it posts -- summary, inline comment or formal review -- counts.
      - name: Count what the reviewer has already posted
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "count=$(bash .github/scripts/count-review-posts.sh)" \
            >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR #: ${{ github.event.pull_request.number }}

            Review this PR against the conventions in AGENTS.md (repo root).
            Focus on: correctness/bugs, security issues, consistency with the
            existing codebase, and test coverage for the change. This is a
            review only — do not push commits or approve/merge the PR;
            setkeh is the required human approver.

            ## How to report findings — read this carefully

            This repo's ruleset sets `required_review_thread_resolution: true`.
            Every inline comment you post therefore BLOCKS THE MERGE until a
            human resolves the thread. An inline comment is not a suggestion
            here — it is a merge gate. Posting one for a nit is a false
            positive with a real cost, and because you re-run on every push,
            nit-level inline comments create an endless fix-push-renit loop.

            Route findings by whether they must change before merge:

            **Inline comments** (`create_inline_comment`) — ONLY for things
            that must be fixed before this PR merges:
              - correctness bugs or logic errors
              - security issues (leaked credentials, injection, unsafe deps)
              - violations of an explicit AGENTS.md rule
              - missing or wrong tests for behaviour the PR introduces
              - broken/failing CI caused by this change

            **Summary comment only** (`gh pr comment`) — EVERYTHING else.
            Never post these inline:
              - style preferences, naming, formatting, docstring symmetry
              - "consider", "might be worth", "nice-to-have", "minor nit"
              - observations, FYIs, tradeoff notes, context for reviewers
              - suggestions for follow-up work or future coverage
              - praise or confirmation that something is correct

            Put non-blocking items under a heading exactly:
            `### Non-blocking observations`
            so they are easy to triage into `nit`-labelled issues later.

            Keep raising nits — they are useful. Just put them in the summary,
            not inline. If you find nothing blocking, post ONLY the summary
            and no inline comments at all; that is the expected outcome for a
            good PR, not a sign you missed something.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Fail rather than report a green check nobody can distinguish from a
      # real review. The prompt above requires a summary comment even when
      # there is nothing blocking, so "posted nothing" is never a legitimate
      # outcome -- it always means the review did not reach the PR.
      #
      # Re-running the job is the remedy; it succeeded on every re-run
      # observed so far.
      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          # One legitimate reason for silence, and it is not #38.
          # claude-code-action refuses to run when this workflow file differs
          # from the copy on the default branch -- it will not let a PR
          # rewrite its own review. The action skips in seconds and posts
          # nothing, which is correct behaviour, so there is no review to
          # assert on. Observed on the PR that added this very step.
          if gh pr diff "${PR}" --name-only \
              | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "::notice::This PR changes the review workflow, so the action declines to run and there is no review to check for. Merge on human review; the next PR is reviewed against the updated workflow."
            exit 0
          fi

          after=$(bash .github/scripts/count-review-posts.sh)
          echo "reviewer posts: ${BEFORE} before, ${after} after"
          if [ "${after}" -gt "${BEFORE}" ]; then
            echo "The review reached the PR."
            exit 0
          fi
          echo "::error::The review job completed but published nothing to PR #${PR} (issue #38). A green check here would be indistinguishable from a reviewed PR. Re-run this job."
          exit 1
