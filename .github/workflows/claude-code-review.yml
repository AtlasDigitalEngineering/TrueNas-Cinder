name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs do not receive secrets, so the action would no-op and still
    # report success. Skip them outright rather than posting a green check
    # that implies a review happened. Do NOT switch to pull_request_target to
    # work around this — it runs untrusted code with write permissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR #: ${{ github.event.pull_request.number }}

            Review this PR against the conventions in AGENTS.md (repo root).
            Focus on: correctness/bugs, security issues, consistency with the
            existing codebase, and test coverage for the change. This is a
            review only — do not push commits or approve/merge the PR;
            setkeh is the required human approver.

            ## How to report findings — read this carefully

            This repo's ruleset sets `required_review_thread_resolution: true`.
            Every inline comment you post therefore BLOCKS THE MERGE until a
            human resolves the thread. An inline comment is not a suggestion
            here — it is a merge gate. Posting one for a nit is a false
            positive with a real cost, and because you re-run on every push,
            nit-level inline comments create an endless fix-push-renit loop.

            Route findings by whether they must change before merge:

            **Inline comments** (`create_inline_comment`) — ONLY for things
            that must be fixed before this PR merges:
              - correctness bugs or logic errors
              - security issues (leaked credentials, injection, unsafe deps)
              - violations of an explicit AGENTS.md rule
              - missing or wrong tests for behaviour the PR introduces
              - broken/failing CI caused by this change

            **Summary comment only** (`gh pr comment`) — EVERYTHING else.
            Never post these inline:
              - style preferences, naming, formatting, docstring symmetry
              - "consider", "might be worth", "nice-to-have", "minor nit"
              - observations, FYIs, tradeoff notes, context for reviewers
              - suggestions for follow-up work or future coverage
              - praise or confirmation that something is correct

            Put non-blocking items under a heading exactly:
            `### Non-blocking observations`
            so they are easy to triage into `nit`-labelled issues later.

            Keep raising nits — they are useful. Just put them in the summary,
            not inline. If you find nothing blocking, post ONLY the summary
            and no inline comments at all; that is the expected outcome for a
            good PR, not a sign you missed something.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
