[tox]
envlist = py310,flake8
skipsdist = True

[testenv]
# Cinder is deliberately excluded — see the note in requirements.txt.
deps = -rtest-requirements.txt
# `python -m pytest` so the repo root is on sys.path; the package is not
# installable yet (issue #23).
commands =
    python -m pytest tests/unit \
        --cov=truenas_cinder_driver \
        --cov-report=xml \
        --cov-report=term-missing \
        {posargs}

[testenv:flake8]
deps = flake8
commands = flake8 truenas_cinder_driver tests

[flake8]
max-line-length = 79
exclude =
    .git,
    .tox,
    .venv,
    __pycache__,
    build,
    dist
