[tox]
envlist = py39,flake8,coverage

[testenv]
deps = -rrequirements.txt
       -rtest-requirements.txt
commands =
    pytest --cov=truenas_cinder_driver --cov-report=xml tests/

[testenv:flake8]
deps = flake8
commands = flake8 truenas_cinder_driver tests/

[testenv:coverage]
deps = coverage
commands =
    coverage erase
    coverage run -m pytest
    coverage report -m