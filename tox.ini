[tox]
envlist = py312,driver,flake8

[testenv]
# Dependencies come from pyproject.toml's extras -- the single source of
# truth. The api_client suite needs no Cinder.
extras = test
commands =
    python -m pytest tests/unit \
        --cov=truenas_cinder_driver \
        --cov-report=xml \
        --cov-report=term-missing \
        {posargs}

[testenv:driver]
# Driver tests import truenas_cinder_driver.driver, which imports Cinder.
extras = driver
commands =
    python -m pytest tests/driver {posargs}

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 truenas_cinder_driver tests tools

[flake8]
max-line-length = 79
exclude =
    .git,
    .tox,
    .venv,
    __pycache__,
    build,
    dist
