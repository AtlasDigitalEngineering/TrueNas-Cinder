[tox]
envlist = py310,driver,flake8
skipsdist = True

[testenv]
# The api_client suite runs on `requests` alone. Cinder is NOT installed
# here — see driver-test-requirements.txt and the `driver` env below.
deps = -rtest-requirements.txt
# `python -m pytest` so the repo root is on sys.path; the package is not
# installable yet (issue #23).
commands =
    python -m pytest tests/unit \
        --cov=truenas_cinder_driver \
        --cov-report=xml \
        --cov-report=term-missing \
        {posargs}

[testenv:driver]
# Driver tests import truenas_cinder_driver.driver, which imports Cinder.
deps = -rdriver-test-requirements.txt
commands =
    python -m pytest tests/driver {posargs}

[testenv:flake8]
deps = flake8
commands = flake8 truenas_cinder_driver tests tools

[flake8]
max-line-length = 79
exclude =
    .git,
    .tox,
    .venv,
    __pycache__,
    build,
    dist
