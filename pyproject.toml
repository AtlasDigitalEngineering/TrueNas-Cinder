[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas-cinder-driver"
dynamic = ["version"]
description = "OpenStack Cinder volume driver for TrueNAS Scale over iSCSI"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "James Griffis", email = "setkeh@gmail.com" }]
keywords = ["openstack", "cinder", "truenas", "iscsi", "storage"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: OpenStack",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]

# Cinder is deliberately NOT here. The driver is loaded *by* a Cinder
# deployment that already provides it, so a wheel install must not drag the
# whole of OpenStack in behind it -- that is what makes `pip install` viable
# inside the cinder-volume image (#24). It lives in the `driver` extra,
# which is for testing against the real base classes.
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.2.0",
    "flake8>=6.0.0",
    "tox>=4.4.0",
]
driver = [
    "truenas-cinder-driver[test]",
    "cinder>=26.0.0,<27.0.0",
]

[project.urls]
Homepage = "https://github.com/AtlasDigitalEngineering/TrueNas-Cinder"
Issues = "https://github.com/AtlasDigitalEngineering/TrueNas-Cinder/issues"

[tool.setuptools]
packages = ["truenas_cinder_driver"]

# Single source of truth. driver.TrueNASISCSIDriver.VERSION reads the same
# attribute, so the version Cinder reports in get_volume_stats cannot drift
# from the version on the wheel.
[tool.setuptools.dynamic]
version = { attr = "truenas_cinder_driver.__version__" }
